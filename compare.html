<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>见山 · 朝山 ｜ 多版本对比台 (V1 / V2 / 3D-v1)</title>
  <style>
    :root {
      --bg: #0c1214;
      --panel: #131c1f;
      --gold: #e4c27a;
      --text: #f3e8d2;
      --muted: rgba(243, 232, 210, 0.68);
      --border: rgba(228, 194, 122, 0.24);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand strong { font-size: 16px; letter-spacing: 0.16em; color: var(--gold); }
    .brand span { font-size: 12px; color: var(--muted); }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .group {
      display: inline-flex; padding: 3px; border-radius: 999px;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border);
    }
    .group button {
      border: 0; background: transparent; color: var(--muted); font-size: 12px;
      padding: 6px 11px; border-radius: 999px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .group button.is-on {
      background: linear-gradient(135deg, rgba(228, 194, 122, 0.28), rgba(164, 118, 46, 0.24));
      color: #fff6e0; font-weight: 600;
    }
    a.open-link {
      font-size: 12px; color: var(--gold); text-decoration: none;
      padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap;
    }
    a.open-link:hover { background: rgba(228, 194, 122, 0.14); }
    main {
      flex: 1; display: grid; grid-template-columns: 1fr; gap: 10px;
      padding: 10px; min-height: 0; background: #080d0e;
    }
    main.is-split { grid-template-columns: 1fr 1fr; }
    .pane {
      display: flex; flex-direction: column; min-height: 0;
      border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #000;
    }
    .pane.is-hidden { display: none; }
    .pane-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; background: rgba(19, 28, 31, 0.92); border-bottom: 1px solid var(--border);
      font-size: 12px;
    }
    .pane-head b { color: var(--gold); letter-spacing: 0.08em; }
    .pane-head small { color: var(--muted); }
    .frame-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      min-height: 0; background: #060a0b; overflow: hidden;
    }
    iframe { width: 100%; height: 100%; border: 0; background: #0c1214; transition: width 0.25s ease, height 0.25s ease; }
    body.is-mobile iframe {
      width: 390px; height: min(844px, 100%);
      border-radius: 24px; box-shadow: 0 0 0 8px #182226, 0 18px 48px rgba(0,0,0,0.65);
    }
    @media (max-width: 900px) {
      main.is-split { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <strong>见山 · 朝山</strong>
      <span>多版本对比台</span>
    </div>
    <div class="controls">
      <div class="group" role="group" aria-label="版本切换">
        <button type="button" data-mode="v2" class="is-on">Demo-V2（纯净版）</button>
        <button type="button" data-mode="3d-v1">3D-v1（大雄宝殿2.5D共修）</button>
        <button type="button" data-mode="v1">Demo-V1（基线）</button>
        <button type="button" data-mode="split">V1 / V2 分屏</button>
      </div>
      <div class="group" role="group" aria-label="视口尺寸">
        <button type="button" data-vp="desktop" class="is-on">全宽桌面</button>
        <button type="button" data-vp="mobile">手机 390×844</button>
      </div>
      <a class="open-link" id="direct-link" href="./" target="_blank" rel="noopener">新窗口打开当前版 ↗</a>
    </div>
  </header>
  <main id="stage">
    <section class="pane is-hidden" id="pane-v1">
      <div class="pane-head">
        <div><b>Demo-V1</b> <small>原始静态演示基线</small></div>
        <a class="open-link" href="./v1/" target="_blank" rel="noopener">独立打开 V1 ↗</a>
      </div>
      <div class="frame-wrap"><iframe id="frame-v1" data-src="./v1/" title="Demo-V1"></iframe></div>
    </section>
    <section class="pane" id="pane-v2">
      <div class="pane-head">
        <div><b>Demo-V2</b> <small>纯净 V2：见山 5 柱 · 4K 山门与五殿 · 同修蒲团/千灯海/本殿祈愿簿</small></div>
        <a class="open-link" href="./" target="_blank" rel="noopener">独立打开 V2 ↗</a>
      </div>
      <div class="frame-wrap"><iframe id="frame-v2" src="./" title="Demo-V2"></iframe></div>
    </section>
    <section class="pane is-hidden" id="pane-3d-v1">
      <div class="pane-head">
        <div><b>3D-v1</b> <small>第一人称真 4K 大雄宝殿共修测试台（发散佛光 · 写实四供 · 7 席蒲团 · 听佛/佛珠/木鱼）</small></div>
        <a class="open-link" href="./3d-v1/" target="_blank" rel="noopener">独立打开 3D-v1 ↗</a>
      </div>
      <div class="frame-wrap"><iframe id="frame-3d-v1" data-src="./3d-v1/" title="3D-v1"></iframe></div>
    </section>
  </main>
  <script>
    const stage = document.getElementById("stage");
    const panes = {
      v1: document.getElementById("pane-v1"),
      v2: document.getElementById("pane-v2"),
      "3d-v1": document.getElementById("pane-3d-v1"),
    };
    const direct = document.getElementById("direct-link");

    function ensureSrc(pane) {
      const f = pane?.querySelector("iframe");
      if (f && !f.getAttribute("src") && f.dataset.src) f.setAttribute("src", f.dataset.src);
    }

    function setMode(mode) {
      document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("is-on", b.dataset.mode === mode));
      stage.classList.toggle("is-split", mode === "split");
      Object.entries(panes).forEach(([key, pane]) => {
        const show = mode === "split" ? (key === "v1" || key === "v2") : key === mode;
        pane.classList.toggle("is-hidden", !show);
        if (show) ensureSrc(pane);
      });
      direct.href = mode === "v1" ? "./v1/" : mode === "3d-v1" ? "./3d-v1/" : "./";
    }

    function setViewport(vp) {
      document.querySelectorAll("[data-vp]").forEach((b) => b.classList.toggle("is-on", b.dataset.vp === vp));
      document.body.classList.toggle("is-mobile", vp === "mobile");
    }

    document.addEventListener("click", (e) => {
      const m = e.target.closest("[data-mode]");
      if (m) setMode(m.dataset.mode);
      const v = e.target.closest("[data-vp]");
      if (v) setViewport(v.dataset.vp);
    });
  </script>
</body>
</html>
