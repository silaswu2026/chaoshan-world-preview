<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080e10" />
  <title>见山 · 朝山 3D ｜ 4K 电影级三维共修圣境</title>
  <link rel="stylesheet" href="./scene3d.css?v=20261125-3d-2" />
</head>
<body>
  <div id="scene3d-wrap">
    <canvas id="scene3d-canvas"></canvas>
    <div id="peer-labels" class="peer-labels" aria-live="polite"></div>

    <!-- 入场金色云雾 Loading -->
    <div class="s3d-loader" id="s3d-loader">
      <div class="s3d-lotus-ring"><i></i><b></b></div>
      <small>JIANSHAN · CHAOSHAN 3D</small>
      <p id="s3d-loader-quote">应无所住，而生其心。——《金刚经》</p>
      <span>正在加载 4K 三维光影圣殿与同修空间…</span>
    </div>

    <!-- 顶部栏 -->
    <header class="s3d-topbar">
      <div class="s3d-brand">
        <strong>见山 · 朝山 3D</strong>
        <small id="s3d-hall-sub">大雄宝殿 · 4K 电影级三维共修空间</small>
      </div>
      <div class="s3d-top-actions">
        <span class="s3d-online-badge" id="s3d-online-badge"><i></i><b id="s3d-peer-num">8</b> 位同修正在殿内</span>
        <button type="button" class="s3d-chip" id="btn-toggle-peers">隐藏同修</button>
        <button type="button" class="s3d-chip" id="btn-s3d-audio">清音 · 关</button>
        <button type="button" class="s3d-chip" id="btn-s3d-lang">EN</button>
      </div>
    </header>

    <!-- 左侧：五座 4K 三维圣殿一键切换 -->
    <aside class="s3d-cameras" aria-label="切换三维圣殿">
      <button type="button" class="is-on" data-hall="gate">大雄宝殿</button>
      <button type="button" data-hall="putuo">普陀 · 观音</button>
      <button type="button" data-hall="wutai">五台 · 文殊</button>
      <button type="button" data-hall="emei">峨眉 · 普贤</button>
      <button type="button" data-hall="jiuhua">九华 · 地藏</button>
    </aside>

    <!-- 第一人称礼拜双手浮层 -->
    <div class="s3d-bow-overlay" id="s3d-bow-overlay" aria-hidden="true">
      <img src="./assets/hands-jade.webp?v=20261124-7" alt="" />
      <span>一心顶礼 · 愿心无散乱</span>
    </div>

    <!-- 底部交互栏 -->
    <footer class="s3d-bottom">
      <p class="s3d-hint" id="s3d-hint">单指拖动环绕 3D 空间 · 双指推近瞻仰 4K 主尊 · 点击同修随喜共愿</p>
      <div class="s3d-actions">
        <button type="button" class="s3d-btn is-gold" id="btn-3d-incense"><b>香</b><span>敬香生烟</span></button>
        <button type="button" class="s3d-btn" id="btn-3d-bow"><b>礼</b><span>第一人称礼拜</span></button>
        <button type="button" class="s3d-btn" id="btn-3d-lamp"><b>灯</b><span>殿前供莲灯</span></button>
        <button type="button" class="s3d-btn" id="btn-3d-wish"><b>愿</b><span>发愿入殿</span></button>
      </div>
    </footer>

    <!-- 发愿弹窗 -->
    <div class="s3d-modal" id="s3d-wish-modal" role="dialog" aria-modal="true" aria-label="殿前发愿">
      <div class="s3d-sheet">
        <h3>在三维圣殿写下心愿</h3>
        <p>你的古风香客形象与心愿将即刻现身大殿三维空间中（仅保存在本机）。</p>
        <input id="s3d-wish-name" type="text" maxlength="8" placeholder="你的香客名（如：清风）" value="清风" />
        <input id="s3d-wish-text" type="text" maxlength="36" placeholder="写下一句清净心愿…" />
        <div class="s3d-sheet-actions">
          <button type="button" class="s3d-btn is-gold" id="btn-3d-wish-submit">发愿并入驻大殿</button>
          <button type="button" class="s3d-chip" id="btn-3d-wish-close">关闭</button>
        </div>
      </div>
    </div>

    <div class="s3d-toast" id="s3d-toast" role="status"></div>
  </div>

  <audio id="s3d-bgm" loop preload="none" src="./assets/audio/heart-sutra.mp3"></audio>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./scene3d.js?v=20261125-3d-2"></script>
</body>
</html>
