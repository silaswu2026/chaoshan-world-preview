<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#080e10" />
  <title>大雄宝殿 · 第一人称多人共修测试 (3D-v1)</title>
  <link rel="stylesheet" href="./hall-test.css?v=20261126-3dv1-11" />
</head>
<body>
  <main class="hall-stage" id="hall-stage">
    <!-- 第一人称视角镜头容器（礼拜跪拜时整体平稳下俯再起身） -->
    <div class="hall-camera" id="hall-camera">
      <!-- 1. 4K 大雄宝殿干净底图（100% 刚体平移，佛像法相绝不变形） -->
      <div class="hall-bg-layer" id="hall-bg-layer" aria-hidden="true"></div>

      <!-- 2. 电影光影层：中轴佛光 + 丁达尔光柱 + 实拍薄雾 + 60fps 丝绸青烟与金光浮尘 -->
      <div class="hall-atmosphere" aria-hidden="true">
        <div class="hall-buddha-glow"></div>
        <div class="hall-rays"><i></i><i></i><i></i></div>
        <div class="hall-mist"></div>
        <canvas id="hall-fx-canvas"></canvas>
      </div>

      <!-- 3. 中景：佛前四供写实供案（一炉、二莲、四灯、四茶，中轴对称） -->
      <section class="hall-altar" id="hall-altar" aria-label="佛前四供供案">
        <div class="altar-incense-box" id="altar-incense-box" role="button" tabindex="0" aria-label="大雄宝殿香炉"></div>
        <div class="altar-candles-layer" id="altar-candles-layer"></div>
        <div class="altar-lotus-layer" id="altar-lotus-layer"></div>
        <div class="altar-tea-row" id="altar-tea-row"></div>
      </section>

      <!-- 4. 殿前写实蒲团阵（左右多席供同修进入礼拜 + 正中主蒲团归属第一人称“你”） -->
      <section class="hall-cushions-layer" id="hall-cushions-layer" aria-label="殿前礼佛蒲团"></section>

      <!-- 5. 动态进入大殿的其他同修（100% 不透明实像，在左右蒲团上真实烧香/跪拜） -->
      <section class="hall-visitors-layer" id="hall-visitors-layer" aria-label="殿内共修同修"></section>
    </div>

    <!-- 6. 第一人称仪式动画舞台（敬香点插 / 自然暖光双手合十 / 奉灯 / 奉茶 / 献花） -->
    <div class="fp-ritual-stage" id="fp-ritual-stage" aria-hidden="true">
      <!-- 敬香：点燃并插向香炉的三柱檀香 -->
      <div class="fp-incense-actor" id="fp-incense-actor">
        <div class="fp-incense-bundle">
          <span class="fp-stick s1"><i class="fp-spark"></i></span>
          <span class="fp-stick s2"><i class="fp-spark"></i></span>
          <span class="fp-stick s3"><i class="fp-spark"></i></span>
          <div class="fp-ignite-flash"></div>
        </div>
      </div>

      <!-- 礼拜：第一人称自然暖光写实合十双手（绝非渗人白手） -->
      <div class="fp-hands-actor" id="fp-hands-actor">
        <img src="./assets/hands-warm-pray.png?v=20261126-3dv1-11" alt="" />
      </div>

      <!-- 供灯 / 奉茶 / 献花 奉上动画载体 -->
      <div class="fp-offer-actor" id="fp-offer-actor">
        <img id="fp-offer-img" src="" alt="" />
        <div class="fp-offer-glow"></div>
      </div>
    </div>

    <!-- 7. 前方实时动态弹窗：【地址】日期、某某、做了什么 -->
    <div class="live-popup-stack" id="live-popup-stack" aria-live="polite"></div>

    <!-- 8. 右上角共修行为清单 / 排行榜（同一个人自动累计计数） -->
    <aside class="merit-board" id="merit-board" aria-label="殿内共修榜">
      <div class="board-head">
        <div class="board-title">
          <i></i>
          <strong id="t-board-title">殿内共修榜</strong>
          <small id="board-total-actions">实时统计</small>
        </div>
        <button type="button" class="board-toggle" id="btn-board-toggle">收起</button>
      </div>
      <ol class="board-list" id="board-list"></ol>
    </aside>

    <!-- 点击供品祈愿 & 合十随喜浮卡 -->
    <div class="offering-popover" id="offering-popover" role="dialog" aria-hidden="true">
      <button type="button" class="popover-close" id="popover-close" aria-label="关闭">×</button>
      <div class="popover-meta" id="popover-meta"></div>
      <p class="popover-wish" id="popover-wish"></p>
      <div class="popover-actions">
        <button type="button" class="popover-bless-btn" id="popover-bless-btn">合十随喜 · <b id="popover-bless-num">0</b></button>
      </div>
    </div>

    <!-- 9. 顶栏（极简 V1 暗青玉细金） -->
    <header class="hall-topbar">
      <div class="hall-title">
        <strong id="t-hall-name">大雄宝殿 · 释迦牟尼佛</strong>
        <small id="t-hall-sub">第一人称共修测试 · 殿前蒲团 + 四大仪式动画 + 实时共修榜</small>
      </div>
      <div class="hall-top-tools">
        <span class="online-pill" id="online-pill">
          <i></i>
          <b id="online-count">46</b> <span id="t-online">位同修在殿</span>
        </span>
        <button type="button" class="tool-btn" id="btn-quiet">清净模式</button>
        <button type="button" class="tool-btn" id="btn-sound">清音 · 关</button>
        <button type="button" class="tool-btn" id="btn-lang">EN</button>
      </div>
    </header>

    <!-- 10. 底部五键共修操作栏（香、礼拜、灯、茶、花） -->
    <footer class="hall-dock">
      <button type="button" class="dock-btn is-gold" id="btn-act-incense"><b>香</b><span id="t-incense">敬香</span></button>
      <button type="button" class="dock-btn" id="btn-act-bow"><b>礼</b><span id="t-bow">礼拜</span></button>
      <button type="button" class="dock-btn" id="btn-act-lamp"><b>灯</b><span id="t-lamp">供灯</span></button>
      <button type="button" class="dock-btn" id="btn-act-tea"><b>茶</b><span id="t-tea">奉茶</span></button>
      <button type="button" class="dock-btn" id="btn-act-lotus"><b>花</b><span id="t-lotus">献花</span></button>
    </footer>

    <div class="hall-toast" id="hall-toast" role="status"></div>
  </main>

  <audio id="hall-bgm" loop preload="none" src="./assets/audio/heart-sutra.mp3"></audio>
  <script src="./hall-test.js?v=20261126-3dv1-11"></script>
</body>
</html>
